name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Tests (unit, property, integration, recovery)
        env:
          HYPOTHESIS_PROFILE: default
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Deep property run
        if: matrix.python == '3.12'
        env:
          HYPOTHESIS_PROFILE: deep
        run: pytest -q tests/property

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: calendar-bridge:ci
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Smoke test
        run: |
          docker run --rm calendar-bridge:ci --version
          # keygen: replaces the empty directory Docker leaves, creates the key once, never replaces it.
          mkdir -p secrets/calendar_bridge_key
          docker run --rm --user 0 --network none -v "$PWD/secrets:/secrets" calendar-bridge:ci \
            keys init /secrets/calendar_bridge_key
          test "$(stat -c '%u %a' secrets/calendar_bridge_key)" = "10001 400"
          docker run --rm --user 0 --network none -v "$PWD/secrets:/secrets" calendar-bridge:ci \
            keys init /secrets/calendar_bridge_key | grep -q "left unchanged"
          KEY=$(docker run --rm calendar-bridge:ci keys generate)
          docker volume create cb-ci
          docker run --rm -e CB_ENCRYPTION_KEY="$KEY" -v cb-ci:/data calendar-bridge:ci init
          docker run --rm -e CB_ENCRYPTION_KEY="$KEY" -v cb-ci:/data calendar-bridge:ci db check
          docker run --rm -e CB_ENCRYPTION_KEY="$KEY" -v cb-ci:/data calendar-bridge:ci status --json
          # No heartbeat yet, so the health command must report unhealthy (exit 1).
          if docker run --rm -v cb-ci:/data calendar-bridge:ci health; then exit 1; fi
          docker run --rm --read-only --user 10001:10001 calendar-bridge:ci --help > /dev/null
