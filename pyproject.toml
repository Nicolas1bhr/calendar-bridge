[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "calendar-bridge"
version = "0.2.0"
description = "Self-hosted, two-way sync between Apple iCloud Calendar and Google Calendar"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Beeckman" }]
keywords = ["icloud", "google-calendar", "caldav", "calendar-sync", "self-hosted", "chatgpt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
# Ranges express compatibility; exact versions and hashes live in requirements.lock.
dependencies = [
    "caldav>=3.3,<4",
    "icalendar>=7.3,<8",
    "google-auth>=2.60,<3",
    "google-auth-oauthlib>=1.5,<2",
    "requests>=2.34,<3",
    "click>=8.3,<9",
    "cryptography>=46",
    "filelock>=3.20",
    "lxml>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "tzdata>=2026.1",
]

[project.urls]
Homepage = "https://github.com/Nicolas1bhr/calendar-bridge"
Documentation = "https://github.com/Nicolas1bhr/calendar-bridge/tree/main/docs"
Issues = "https://github.com/Nicolas1bhr/calendar-bridge/issues"
Changelog = "https://github.com/Nicolas1bhr/calendar-bridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.150",
    "radicale>=3.8,<4",
    "ruff>=0.16",
    "mypy>=2.0",
    "types-requests",
    "types-python-dateutil",
]

[project.scripts]
calendar-bridge = "calendar_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: runs against the real Google Calendar API and iCloud CalDAV (opt-in, needs credentials)",
    "slow: longer-running scenario tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:caldav.*",
    "ignore::DeprecationWarning:radicale.*",
]

[tool.coverage.run]
source = ["calendar_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity heuristics; the sync rules are inherently branchy
    "S101",   # asserts are used for internal invariants
    "S311",   # random is not used for security
    "RUF012",
    "PLC0415",  # local imports keep optional heavy modules off the CLI startup path
    "PLR0917",  # click commands and conversion helpers take many parameters by design
    "S105",     # constants such as TOKEN_URI are not secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/calendar_bridge"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["caldav.*", "google_auth_oauthlib.*", "google.*", "lxml.*", "icalendar.*", "radicale.*", "oauthlib.*"]
ignore_missing_imports = true
